[package]
name = "wckd"
version = "0.1.0"
description = "WCKD — gerenciador financeiro pessoal"
authors = ["asafe"]
license = "MIT"
repository = "https://github.com/asafeareas/WCKD"
edition = "2021"
rust-version = "1.85"

[lib]
name = "wckd_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
